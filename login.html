<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — LifeLink</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1CA7EC" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="brand">
      <span class="dot-link"><svg viewBox="0 0 24 24" fill="none"><path d="M8 12h8M9 6l-3 3a3 3 0 000 4.24M15 18l3-3a3 3 0 000-4.24" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></span>
      LifeLink
    </div>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="services.html">Local Services</a>
      <a href="map.html">Map</a>
      <a href="healthcare.html">Healthcare</a>
      <a href="alerts.html">Alerts</a>
      <a href="become-provider.html">Become a Provider</a>
      <a href="login.html" class="active">Log In</a>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  </div>
</header>

<section>
  <div class="container">
    <div class="card form-card">
      <div class="flex-between mt-8" style="margin-bottom:20px;">
        <button class="btn btn-ghost btn-sm" id="tab-login">Log In</button>
        <button class="btn btn-ghost btn-sm" id="tab-signup">Create Account</button>
      </div>

      <form id="login-form">
        <h2>Welcome back</h2>
        <div class="field">
          <label>Email</label>
          <input type="email" id="login-email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
        <p class="muted text-center mt-16 mb-0">Don't have an account? <a href="#" id="switch-signup">Sign up</a></p>
      </form>

      <form id="signup-form" style="display:none;">
        <h2>Create your account</h2>
        <div class="field">
          <label>Full name</label>
          <input type="text" id="signup-name" required placeholder="Jane Doe" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="signup-email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label>Phone number</label>
          <input type="tel" id="signup-phone" placeholder="+234 800 000 0000" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="signup-password" required minlength="6" placeholder="At least 6 characters" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        <p class="muted text-center mt-16 mb-0">Already have an account? <a href="#" id="switch-login">Log in</a></p>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <span>© 2026 LifeLink. Built for stronger communities.</span>
    <span><a href="admin-login.html">Admin</a></span>
  </div>
</footer>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/chatbot.js"></script>
<script type="module">
  import { LL } from "./js/app.js";

  const loginForm = document.getElementById("login-form");
  const signupForm = document.getElementById("signup-form");
  function showLogin() { loginForm.style.display = "block"; signupForm.style.display = "none"; }
  function showSignup() { loginForm.style.display = "none"; signupForm.style.display = "block"; }
  document.getElementById("tab-login").addEventListener("click", showLogin);
  document.getElementById("tab-signup").addEventListener("click", showSignup);
  document.getElementById("switch-signup").addEventListener("click", (e) => { e.preventDefault(); showSignup(); });
  document.getElementById("switch-login").addEventListener("click", (e) => { e.preventDefault(); showLogin(); });

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await LL.loginUser(document.getElementById("login-email").value.trim(), document.getElementById("login-password").value);
      LL.toast("Welcome back!");
      setTimeout(() => window.location.href = "profile.html", 500);
    } catch (err) {
      LL.toast(err.message);
    }
  });

  signupForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await LL.registerUser({
        name: document.getElementById("signup-name").value.trim(),
        email: document.getElementById("signup-email").value.trim(),
        phone: document.getElementById("signup-phone").value.trim(),
        password: document.getElementById("signup-password").value,
      });
      LL.toast("Account created!");
      setTimeout(() => window.location.href = "profile.html", 500);
    } catch (err) {
      LL.toast(err.message);
    }
  });
</script>
</body>
</html>
